name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------
      # GitHub Stats
      # -----------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=vikassinghz&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&bg_color=0D1117&text_color=E6EDF3&icon_color=6D28D9&title_color=6D28D9&border_color=6D28D9&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Top Languages
      # -----------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=vikassinghz&layout=compact&langs_count=8&theme=tokyonight&bg_color=0D1117&text_color=E6EDF3&title_color=6D28D9&border_color=6D28D9&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Contribution Calendar
      # -----------------------------
      - name: Generate Contribution Calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_contributions.py

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
